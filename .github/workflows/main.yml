name: Buttplug CI Build

on:
  push:
    branches:
      - dev
      - master
      - protocol-work**

concurrency:
  group: ${{ github.head_ref ||  github.ref }}
  cancel-in-progress: true

jobs:
  build-stable:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@v7
    - name: Fix ~/.cargo directory permissions
      if: startsWith(matrix.os, 'ubuntu') || startsWith(matrix.os, 'macos')
      run: if [ -d ~/.cargo ]; then sudo chown -R $(whoami):$(id -ng) ~/.cargo/; fi
    - name: Update package list
      if: startsWith(matrix.os, 'ubuntu')
      run: sudo apt-get -y update
    - name: Install required packages
      if: startsWith(matrix.os, 'ubuntu')
      run: sudo apt-get -y install libudev-dev libusb-1.0-0-dev libdbus-1-dev
    - name: Cache cargo registry
      uses: actions/cache@v6
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('.github/workflows/cache_version') }}
    - name: Cache cargo build
      uses: actions/cache@v6
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('.github/workflows/cache_version') }}
    - name: Rust toolchain fetch
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: rustfmt, clippy
    - name: Formatting check
      continue-on-error: true
      run: cargo fmt --all -- --check
    - name: Build Debug
      run: cargo build
    - name: Run tests
      run: cargo test
    # Only run doc gen on windows. It has the most code to build anyways, all other projects are a subset of it.
    - name: Run doc gen
      if: startsWith(matrix.os, 'windows')
      run: cargo doc --no-deps
#    - name: Build Release
#      run: cargo build --release
  build-wasm:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Fix ~/.cargo directory permissions
      run: if [ -d ~/.cargo ]; then sudo chown -R $(whoami):$(id -ng) ~/.cargo/; fi
    - name: Update package list
      run: sudo apt-get -y update
    - name: Install required packages
      run: sudo apt-get -y install libudev-dev libusb-1.0-0-dev libdbus-1-dev
    - name: Cache cargo registry
      uses: actions/cache@v6
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('.github/workflows/cache_version') }}
    - name: Cache cargo build
      uses: actions/cache@v6
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('.github/workflows/cache_version') }}
    - name: Rust toolchain fetch
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: rustfmt, clippy
    - name: WASM Toolchain fetch
      uses: jetli/wasm-pack-action@v0.4.0
      with:
        # Pinned: 'latest' does an unauthenticated API lookup that falls back to v0.9.1 when rate limited.
        version: 'v0.15.1'
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: wasm/package-lock.json
    - name: Build WASM crate
      run: wasm-pack build --dev crates/buttplug_wasm --target web
    - name: Install workspace dependencies
      run: cd wasm && npm ci
    - name: Build packages
      run: cd wasm && npm run build:blob && npm run build:connector
