[package]
name = "buttplug_tests"
version = "0.0.0"
authors = ["Nonpolynomial Labs, LLC <kyle@nonpolynomial.com>"]
description = "Buttplug Intimate Hardware Control Library - Core Library"
license = "BSD-3-Clause"
homepage = "http://buttplug.io"
repository = "https://github.com/buttplugio/buttplug.git"
readme = "./README.md"
keywords = ["usb", "serial", "hardware", "bluetooth", "teledildonics"]
edition = "2024"

[dependencies]
buttplug_core = { version = "10.0.4", path = "../buttplug_core" }
buttplug_client = { version = "10.0.3", path = "../buttplug_client" }
buttplug_client_in_process = { version = "10.0.4", path = "../buttplug_client_in_process", default-features = false}
buttplug_server = { version = "10.0.5", path = "../buttplug_server" }
buttplug_server_device_config = { version = "10.2.0", path = "../buttplug_server_device_config" }
log = "0.4.33"
tokio = { version = "1.53.1", features = ["macros"] }
uuid = "1.24.0"
futures = "0.3.33"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tokio-test = "0.4.5"
serde = "1.0.229"
async-trait = "0.1.91"
dashmap = "6.2.1"
thiserror = "2.0.19"
getset = "0.1.7"
jsonschema = { version = "0.49.1", default-features = false }
test-case = "3.3.1"
serde_yaml = "0.9.34"
