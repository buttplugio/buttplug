devices:
  - identifier:
      name: "YCY-FJB-02"
    expected_name: "Yiciyuan FJB-02"

device_init_timeout_ms: 3000
device_init:
  - !Commands
      device_index: 0
      commands:
        - !Subscribe
            endpoint: rxblebattery
        - !Write
            endpoint: tx
            data: [0x35, 0x10, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
            write_with_response: false
device_commands:
  # FJB-02 reports motor counts 8/0/0. Its single control moves stroke and
  # rotation together; B/C fields remain zero in the 16-byte frame.
  - !VersionGated
      min_spec_version: 3
      commands:
        - !Messages
            device_index: 0
            messages:
              - !Stop
        - !Commands
            device_index: 0
            commands:
              - !Write
                  endpoint: tx
                  data: [0x35, 0x12, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
                  write_with_response: false

        - !Messages
            device_index: 0
            messages:
              - !Scalar
                - Index: 0
                  Scalar: 0.5
                  ActuatorType: Oscillate
        - !Commands
            device_index: 0
            commands:
              - !Write
                  endpoint: tx
                  data: [0x35, 0x12, 0x0A, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
                  write_with_response: false

        - !Messages
            device_index: 0
            messages:
              - !Stop
        - !Commands
            device_index: 0
            commands:
              - !Write
                  endpoint: tx
                  data: [0x35, 0x12, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
                  write_with_response: false
