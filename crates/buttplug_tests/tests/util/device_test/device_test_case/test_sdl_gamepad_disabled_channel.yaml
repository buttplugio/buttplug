devices:
  - identifier:
      name: "sdl-gamepad"
      address: "SdlDisabledChannelTest"
      sdl_selection: "__sdl-rumble-and-triggers"
    expected_name: "sdl-gamepad"
user_device_config_file: "sdl_gamepad_disabled_channel.json"
device_commands:
  - !Messages
      device_index: 0
      messages:
        - !Vibrate
          - Index: 0
            Speed: 0.5
  - !Commands
      device_index: 0
      commands:
        - !Write
            endpoint: tx
            data: [0x00, 0x80, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
            write_with_response: false
  - !Messages
      device_index: 0
      messages:
        - !Vibrate
          - Index: 1
            Speed: 0.25
  - !Commands
      device_index: 0
      commands:
        - !Write
            endpoint: tx
            data: [0x00, 0x80, 0x00, 0x00, 0x00, 0x40, 0x00, 0x00]
            write_with_response: false
  - !Messages
      device_index: 0
      messages:
        - !Vibrate
          - Index: 2
            Speed: 0.75
  - !Commands
      device_index: 0
      commands:
        - !Write
            endpoint: tx
            data: [0x00, 0x80, 0x00, 0x00, 0x00, 0x40, 0x00, 0xc0]
            write_with_response: false
