devices:
  - identifier:
      name: "HISMITH S2"
    expected_name: "Hismith Servo Sex Machine"
device_init:
  - !Events
    device_index: 0
    events:
      - !Reads
        - endpoint: rxblemodel
          data: [0x11, 0x01]
device_commands:
  # Two-slider S2: v3 ScalarCmd index 0 = speed (Oscillate), index 1 = depth (Position, 0 = shallow,
  # 1 = deep). Depth slides a 40-wide stroke window: 0 -> 0..40, 0.5 -> 30..70, 1 -> 60..100. The
  # limits are written in the order that keeps the window valid (deeper: end then start, shallower:
  # start then end). This is the path MultiFunPlayer uses.
  - !Messages
      device_index: 0
      messages:
        - !Scalar
          - Index: 0
            Scalar: 0.5
            ActuatorType: Oscillate
  - !Commands
      device_index: 0
      commands:
        - !Write
            endpoint: tx
            data: [0xCC, 0x03, 0x32, 0x35]
            write_with_response: false
  - !Messages
      device_index: 0
      messages:
        - !Scalar
          - Index: 1
            Scalar: 1.0
            ActuatorType: Position
  - !Commands
      device_index: 0
      commands:
        - !Write
            endpoint: tx
            data: [0xCC, 0x08, 0x64, 0x6C]
            write_with_response: false
        - !Write
            endpoint: tx
            data: [0xCC, 0x07, 0x3C, 0x43]
            write_with_response: false
  - !Messages
      device_index: 0
      messages:
        - !Scalar
          - Index: 1
            Scalar: 0.0
            ActuatorType: Position
  - !Commands
      device_index: 0
      commands:
        - !Write
            endpoint: tx
            data: [0xCC, 0x07, 0x00, 0x07]
            write_with_response: false
        - !Write
            endpoint: tx
            data: [0xCC, 0x08, 0x28, 0x30]
            write_with_response: false
  - !Messages
      device_index: 0
      messages:
        - !Scalar
          - Index: 1
            Scalar: 0.5
            ActuatorType: Position
  - !Commands
      device_index: 0
      commands:
        - !Write
            endpoint: tx
            data: [0xCC, 0x08, 0x46, 0x4E]
            write_with_response: false
        - !Write
            endpoint: tx
            data: [0xCC, 0x07, 0x1E, 0x25]
            write_with_response: false
  # Stroke width (index 2, 10..100): 0.0 -> width 10; at depth 0.5 the window becomes 45..55
  # (start moves deeper, so the end is written first).
  - !Messages
      device_index: 0
      messages:
        - !Scalar
          - Index: 2
            Scalar: 0.0
            ActuatorType: Position
  - !Commands
      device_index: 0
      commands:
        - !Write
            endpoint: tx
            data: [0xCC, 0x08, 0x37, 0x3F]
            write_with_response: false
        - !Write
            endpoint: tx
            data: [0xCC, 0x07, 0x2D, 0x34]
            write_with_response: false
  # Run mode (index 3): 1 = manual
  - !Messages
      device_index: 0
      messages:
        - !Scalar
          - Index: 3
            Scalar: 1.0
            ActuatorType: Position
  - !Commands
      device_index: 0
      commands:
        - !Write
            endpoint: tx
            data: [0xCC, 0x01, 0xA1, 0xA2]
            write_with_response: false
  # Preset mode (index 4, 0..8): 0.375 -> mode 3
  - !Messages
      device_index: 0
      messages:
        - !Scalar
          - Index: 4
            Scalar: 0.375
            ActuatorType: Position
  - !Commands
      device_index: 0
      commands:
        - !Write
            endpoint: tx
            data: [0xCC, 0x04, 0x03, 0x07]
            write_with_response: false
  # Stop only sets the speed to 0; the depth window is left alone, so exactly one frame is written.
  - !Messages
      device_index: 0
      messages:
        - !Stop
  - !Commands
      device_index: 0
      commands:
        - !Write
            endpoint: tx
            data: [0xCC, 0x03, 0x00, 0x03]
            write_with_response: false
