devices:
  - identifier:
      name: "F1SV3"
    expected_name: "Lelo F1s V3"
device_init:
  - !Commands
    device_index: 0
    commands:
      - !Subscribe
        endpoint: generic0
  - !Events
    device_index: 0
    events:
      - !Notifications
        - endpoint: generic0
          data: [0,0,0,0,0,0,0,0]
  - !Events
    device_index: 0
    events:
      - !Notifications
        - endpoint: generic0
          data: [1,2,3,4,5,6,8]
  - !Commands
    device_index: 0
    commands:
      - !Unsubscribe
        endpoint: generic0
      - !Write
        endpoint: generic0
        data: [1,2,3,4,5,6,8]
        write_with_response: true
      - !Subscribe
        endpoint: generic0
  - !Events
    device_index: 0
    events:
      - !Notifications
        - endpoint: generic0
          data: [0x01, 0, 0, 0, 0, 0, 0, 0]
device_commands:
  - !Messages
      device_index: 0
      messages:
        - !Vibrate
          - Index: 0
            Speed: 0.5
  - !Commands
      device_index: 0
      commands:
        - !Write
            endpoint: txvibrate
            data: [0x0a, 0x12, 0x01, 0x08, 0x00, 0x00, 0x00, 0x00, 0x32, 0x00]
            write_with_response: true
  - !Messages
      device_index: 0
      messages:
        - !Vibrate
          - Index: 0
            Speed: 0.75
          - Index: 1
            Speed: 0.5
  - !Commands
      device_index: 0
      commands:
        - !Write
            endpoint: txvibrate
            data: [0x0a, 0x12, 0x01, 0x08, 0x00, 0x00, 0x00, 0x00, 0x4b, 0x00]
            write_with_response: true
        - !Write
            endpoint: txvibrate
            data: [0x0a, 0x12, 0x02, 0x08, 0x00, 0x00, 0x00, 0x00, 0x32, 0x00]
            write_with_response: true
  - !Messages
      device_index: 0
      messages:
        - !Stop
  - !Commands
      device_index: 0
      commands:
        - !Write
            endpoint: txvibrate
            data: [0x0a, 0x12, 0x01, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
            write_with_response: true
        - !Write
            endpoint: txvibrate
            data: [0x0a, 0x12, 0x02, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
            write_with_response: true
