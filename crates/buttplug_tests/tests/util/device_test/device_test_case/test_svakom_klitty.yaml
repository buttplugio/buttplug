devices:
  - identifier:
      name: "ST462A"
    expected_name: "Svakom Klitty"
device_commands:
  - !Messages
      device_index: 0
      messages:
        - !Vibrate
          - Index: 0
            Speed: 0.5
  - !Commands
      device_index: 0
      commands:
        - !Write
            endpoint: tx
            data: [0x55, 0x03, 0x00, 0x00, 0x01, 0x05, 0x00]
            write_with_response: false
  - !Messages
      device_index: 0
      messages:
        - !Scalar
          - Index: 1
            Scalar: 1.0
            ActuatorType: Constrict
  - !Commands
      device_index: 0
      commands:
        - !Write
            endpoint: tx
            data: [0x55, 0x09, 0x00, 0x00, 0x03, 0x00, 0x00]
            write_with_response: false
  - !Messages
      device_index: 0
      messages:
        - !Scalar
          - Index: 2
            Scalar: 0.5
            ActuatorType: Rotate
  - !Commands
      device_index: 0
      commands:
        - !Write
            endpoint: tx
            data: [0x55, 0x14, 0x00, 0x00, 0x01, 0x05, 0x00]
            write_with_response: false
  - !Messages
      device_index: 0
      messages:
        - !Stop
  - !Commands
      device_index: 0
      commands:
        - !Write
            endpoint: tx
            data: [0x55, 0x03, 0x00, 0x00, 0x00, 0x00, 0x00]
            write_with_response: false
        - !Write
            endpoint: tx
            data: [0x55, 0x09, 0x00, 0x00, 0x00, 0x00, 0x00]
            write_with_response: false
        - !Write
            endpoint: tx
            data: [0x55, 0x14, 0x00, 0x00, 0x00, 0x00, 0x00]
            write_with_response: false
