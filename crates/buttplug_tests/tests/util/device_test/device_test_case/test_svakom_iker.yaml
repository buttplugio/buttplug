devices:
  - identifier:
      name: "Iker"
    expected_name: "Svakom Iker"
device_commands:
  - !Messages
      device_index: 0
      messages:
        - !Vibrate
          - Index: 0
            Speed: 0.5
  - !Commands
      device_index: 0
      commands:
        - !Write
            endpoint: tx
            data: [0x55, 0x03, 0x03, 0x00, 0x01, 0x05]
            write_with_response: false
  - !Messages
      device_index: 0
      messages:
        - !Vibrate
          - Index: 0
            Speed: 0.75
          - Index: 1
            Speed: 0.5
  - !Commands
      device_index: 0
      commands:
        - !Write
            endpoint: tx
            data: [0x55, 0x03, 0x03, 0x00, 0x01, 0x08]
            write_with_response: false
        - !Write
            endpoint: tx
            data: [0x55, 0x07, 0x00, 0x00, 0x03, 0x00]
            write_with_response: false
  # Vibrator off (mode 0) also stops the pulsator, so the pulsator is restarted after it.
  - !Messages
      device_index: 0
      messages:
        - !Vibrate
          - Index: 0
            Speed: 0
  - !Commands
      device_index: 0
      commands:
        - !Write
            endpoint: tx
            data: [0x55, 0x03, 0x03, 0x00, 0x00, 0x00]
            write_with_response: false
        - !Write
            endpoint: tx
            data: [0x55, 0x07, 0x00, 0x00, 0x03, 0x00]
            write_with_response: false
  - !Messages
      device_index: 0
      messages:
        - !Stop
  - !Commands
      device_index: 0
      commands:
        - !Write
            endpoint: tx
            data: [0x55, 0x03, 0x03, 0x00, 0x00, 0x00]
            write_with_response: false
  - !Messages
      device_index: 0
      messages:
        - !Vibrate
          - Index: 0
            Speed: 0.5
          - Index: 1
            Speed: 0.5
  - !Commands
      device_index: 0
      commands:
        - !Write
            endpoint: tx
            data: [0x55, 0x03, 0x03, 0x00, 0x01, 0x05]
            write_with_response: false
        - !Write
            endpoint: tx
            data: [0x55, 0x07, 0x00, 0x00, 0x03, 0x00]
            write_with_response: false
  # Pulsator changes never resend the vibrator packet.
  - !Messages
      device_index: 0
      messages:
        - !Vibrate
          - Index: 1
            Speed: 0
  - !Commands
      device_index: 0
      commands:
        - !Write
            endpoint: tx
            data: [0x55, 0x07, 0x00, 0x00, 0x00, 0x00]
            write_with_response: false
  - !Messages
      device_index: 0
      messages:
        - !Vibrate
          - Index: 0
            Speed: 0
  - !Commands
      device_index: 0
      commands:
        - !Write
            endpoint: tx
            data: [0x55, 0x03, 0x03, 0x00, 0x00, 0x00]
            write_with_response: false
  # With the vibrator off, pulsator changes must not send the vibrator stop packet, which would
  # stop and restart the pulsator on every change.
  - !Messages
      device_index: 0
      messages:
        - !Vibrate
          - Index: 1
            Speed: 0.5
  - !Commands
      device_index: 0
      commands:
        - !Write
            endpoint: tx
            data: [0x55, 0x07, 0x00, 0x00, 0x03, 0x00]
            write_with_response: false
  - !Messages
      device_index: 0
      messages:
        - !Vibrate
          - Index: 1
            Speed: 1.0
  - !Commands
      device_index: 0
      commands:
        - !Write
            endpoint: tx
            data: [0x55, 0x07, 0x00, 0x00, 0x05, 0x00]
            write_with_response: false
