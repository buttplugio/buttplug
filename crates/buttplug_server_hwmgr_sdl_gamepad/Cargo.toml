[package]
name = "buttplug_server_hwmgr_sdl_gamepad"
version = "11.0.0"
authors = ["Nonpolynomial Labs, LLC <kyle@nonpolynomial.com>"]
description = "Buttplug Intimate Hardware Control Library - SDL3 Gamepad Hardware Manager"
license = "BSD-3-Clause"
homepage = "http://buttplug.io"
repository = "https://github.com/buttplugio/buttplug.git"
readme = "./README.md"
keywords = ["usb", "serial", "hardware", "bluetooth", "teledildonics"]
edition = "2024"
exclude = ["examples/**"]

[lib]
name = "buttplug_server_hwmgr_sdl_gamepad"
path = "src/lib.rs"
test = true
doctest = true
doc = true

[[example]]
name = "sdl3_thread_spike"
path = "examples/sdl3_thread_spike.rs"

[dependencies]
buttplug_core = { version = "11.0.0", path = "../buttplug_core", default-features = false }
buttplug_server = { version = "11.0.0", path = "../buttplug_server", default-features = false }
buttplug_server_device_config = { version = "11.0.0", path = "../buttplug_server_device_config" }
futures = "0.3.33"
futures-util = "0.3.33"
log = "0.4.33"
tokio = { version = "1.53.1", features = ["sync", "time", "rt"] }
async-trait = "0.1.91"
uuid = { version = "1.24.0", features = ["serde", "v4"] }
tracing = "0.1.44"
thiserror = "2.0.19"
byteorder = "1.5.0"
tokio-util = "0.7.19"
sdl3 = { version = "0.18.4", features = ["build-from-source-static"] }
# Direct sdl3-sys dep exists solely to enable `debug-impls` (Debug/Display
# derives on SDL newtypes like JoystickId); features unify with the sdl3
# crate's own sdl3-sys dependency, so nothing about linking changes.
sdl3-sys = { version = "0.6.8", default-features = false, features = ["debug-impls", "display-impls"] }

[dev-dependencies]
buttplug_core = { version = "11.0.0", path = "../buttplug_core", default-features = false, features = ["tokio-runtime"] }
tokio = { version = "1.53.1", features = ["rt", "macros", "time", "sync"] }
futures = "0.3.33"
