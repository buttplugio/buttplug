[package]
name = "buttplug_server_hwmgr_sdl_gamepad"
version = "11.0.0"
authors = ["Nonpolynomial Labs, LLC <kyle@nonpolynomial.com>"]
description = "Buttplug Intimate Hardware Control Library - SDL3 Gamepad Hardware Manager"
license = "BSD-3-Clause"
homepage = "http://buttplug.io"
repository = "https://github.com/buttplugio/buttplug.git"
readme = "./README.md"
keywords = ["usb", "serial", "hardware", "bluetooth", "teledildonics"]
edition = "2024"

[lib]
name = "buttplug_server_hwmgr_sdl_gamepad"
path = "src/lib.rs"
test = true
doctest = true
doc = true

[dependencies]
buttplug_core = { version = "11.0.0", path = "../buttplug_core", default-features = false }
buttplug_server = { version = "11.0.0", path = "../buttplug_server", default-features = false }
buttplug_server_device_config = { version = "11.0.0", path = "../buttplug_server_device_config" }
futures = "0.3.34"
futures-util = "0.3.34"
log = "0.4.34"
tokio = { version = "1.53.1", features = ["sync", "time", "rt"] }
async-trait = "0.1.92"
uuid = { version = "1.26.1", features = ["serde", "v4"] }
tracing = "0.1.44"
thiserror = "2.0.20"
byteorder = "1.5.0"
tokio-util = "0.7.19"
sdl3 = { version = "0.20.0", features = ["build-from-source-static"] }
# Direct sdl3-sys dep exists solely to enable `debug-impls` (Debug/Display
# derives on SDL newtypes like JoystickId) and to prune SDL subsystems this
# manager never uses; features unify with the sdl3 crate's own sdl3-sys
# dependency, so nothing about linking changes.
#
# Gamepad-only build: joystick, haptic, and hidapi stay on (gamepad input and
# rumble); audio, video (with its gpu/render/camera dependents), dialog, and
# tray are compiled out, so SDL never requires ALSA or X11/Wayland at build
# time and the resulting library links without a display stack. Keep
# sdl-unix-console-build: SDL's cmake hard-fails on unix when neither X11 nor
# Wayland dev libraries are found, and video is disabled here.
sdl3-sys = { version = "0.7.1", default-features = false, features = ["debug-impls", "display-impls", "sdl-unix-console-build", "no-sdl-audio", "no-sdl-video", "no-sdl-gpu", "no-sdl-render", "no-sdl-camera", "no-sdl-dialog", "no-sdl-tray"] }

[dev-dependencies]
buttplug_core = { version = "11.0.0", path = "../buttplug_core", default-features = false, features = ["tokio-runtime"] }
tokio = { version = "1.53.1", features = ["rt", "macros", "time", "sync"] }
futures = "0.3.34"
