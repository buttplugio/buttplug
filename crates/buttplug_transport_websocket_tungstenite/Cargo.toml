[package]
name = "buttplug_transport_websocket_tungstenite"
version = "10.0.4"
authors = ["Nonpolynomial Labs, LLC <kyle@nonpolynomial.com>"]
description = "Buttplug Intimate Hardware Control Library - Server Device Config Library"
license = "BSD-3-Clause"
homepage = "http://buttplug.io"
repository = "https://github.com/buttplugio/buttplug.git"
readme = "./README.md"
keywords = ["usb", "serial", "hardware", "bluetooth", "teledildonics"]
edition = "2024"
exclude = ["examples/**"]

[lib]
name = "buttplug_transport_websocket_tungstenite"
path = "src/lib.rs"
test = true
doctest = true
doc = true


[dependencies]
buttplug_core = { version = "10.0.4", path = "../buttplug_core" }
futures = "0.3.33"
futures-util = "0.3.33"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_repr = "0.1.21"
thiserror = "2.0.19"
displaydoc = "0.2.6"
dashmap = { version = "6.2.1", features = ["serde"] }
log = "0.4.33"
getset = "0.1.7"
jsonschema = { version = "0.49.1", default-features = false }
uuid = { version = "1.24.0", features = ["serde", "v4"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots", "url"]}
rustls = { version = "0.23.42", default-features = false, features = ["ring"]}
tokio = { version = "1.53.1", features = ["sync", "macros", "io-util"] }
tracing = "0.1.44"
url = "2.5.8"
