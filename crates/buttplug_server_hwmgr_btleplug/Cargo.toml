[package]
name = "buttplug_server_hwmgr_btleplug"
version = "11.0.0"
authors = ["Nonpolynomial Labs, LLC <kyle@nonpolynomial.com>"]
description = "Buttplug Intimate Hardware Control Library - Core Library"
license = "BSD-3-Clause"
homepage = "http://buttplug.io"
repository = "https://github.com/buttplugio/buttplug.git"
readme = "./README.md"
keywords = ["usb", "serial", "hardware", "bluetooth", "teledildonics"]
edition = "2024"
exclude = ["examples/**"]

[lib]
name = "buttplug_server_hwmgr_btleplug"
path = "src/lib.rs"
test = true
doctest = true
doc = true


[dependencies]
buttplug_core = { version = "11.0.0", path = "../buttplug_core", default-features = false }
buttplug_server = { version = "11.0.0", path = "../buttplug_server", default-features = false }
buttplug_server_device_config = { version = "11.0.0", path = "../buttplug_server_device_config" }
futures = "0.3.33"
futures-util = "0.3.33"
log = "0.4.33"
tokio = { version = "1.53.1", features = ["sync", "time"] }
# btleplug = { version = "0.12.0", path = "../../../btleplug" }
btleplug = { version = "0.12.0" }
async-trait = "0.1.91"
uuid = { version = "1.24.0", features = ["serde", "v4"] }
dashmap = { version = "6.2.1", features = ["serde"] }
tracing = "0.1.44"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Devices_Bluetooth", "Foundation"] }
