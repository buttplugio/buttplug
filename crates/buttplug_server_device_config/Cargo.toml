[package]
name = "buttplug_server_device_config"
version = "12.0.0"
authors = ["Nonpolynomial Labs, LLC <kyle@nonpolynomial.com>"]
description = "Buttplug Intimate Hardware Control Library - Server Device Config Library"
license = "BSD-3-Clause"
homepage = "http://buttplug.io"
repository = "https://github.com/buttplugio/buttplug.git"
readme = "./README.md"
keywords = ["usb", "serial", "hardware", "bluetooth", "teledildonics"]
edition = "2024"
exclude = ["examples/**"]

[lib]
name = "buttplug_server_device_config"
path = "src/lib.rs"
test = true
doctest = true
doc = true

[dependencies]
buttplug_core = { version = "11.0.1", path = "../buttplug_core", default-features = false }
futures = "0.3.34"
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_repr = "0.1.21"
thiserror = "2.0.20"
displaydoc = "0.2.7"
dashmap = { version = "6.2.1", features = ["serde"] }
log = "0.4.34"
getset = "0.1.7"
jsonschema = { version = "0.56.0", default-features = false }
uuid = { version = "1.26.1", features = ["serde", "v4"] }
strum_macros = "0.28.0"
strum = "0.28.0"
enumflags2 = "0.7.12"

[build-dependencies]
serde_yaml = "0.9.34"
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
buttplug_core = { version = "11.0.1", path = "../buttplug_core" }

[dev-dependencies]
test-case = "3.3.1"
serde_json = "1.0"
serde_yaml = "0.9"
