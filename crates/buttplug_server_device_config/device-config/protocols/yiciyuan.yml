configurations:
# BLE device-info replies confirm that FJB-02 has motor A (8 fixed modes)
# and no B/C motors. Its stroke and rotation move together under one control.
# FJB-03 physical testing identified A as stroke, B as suction and C as
# independent vibration. C responds to its seven fixed modes (35 11 04 N),
# not to real-time levels in the 35 12 packet.
