[package]
name = "buttplug_server_hwmgr_webbluetooth"
version = "11.0.0"
authors = ["Nonpolynomial Labs, LLC <kyle@nonpolynomial.com>"]
description = "Buttplug Intimate Hardware Control Library - WebBluetooth Hardware Manager for WASM"
license = "BSD-3-Clause"
homepage = "http://buttplug.io"
repository = "https://github.com/buttplugio/buttplug.git"
keywords = ["bluetooth", "hardware", "wasm", "webbluetooth", "teledildonics"]
edition = "2024"

[lib]
name = "buttplug_server_hwmgr_webbluetooth"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1.91"
futures = "0.3.33"
tokio = { version = "1.53.1", features = ["sync"] }
tracing = "0.1.44"

# This crate only builds for wasm; its code is gated behind
# cfg(target_arch = "wasm32") in src/lib.rs. The wasm-flavored
# buttplug_core/buttplug_server dependencies live here rather than in
# [dependencies] so that native builds never unify their "wasm" features
# into the rest of the workspace.
[target.'cfg(target_arch = "wasm32")'.dependencies]
buttplug_core = { version = "11.0.0", path = "../buttplug_core", default-features = false, features = ["wasm"] }
buttplug_server = { version = "11.0.0", path = "../buttplug_server", default-features = false, features = ["wasm"] }
buttplug_server_device_config = { version = "11.0.0", path = "../buttplug_server_device_config" }
js-sys = "0.3.103"
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4.76"
web-sys = { version = "0.3.103", features = [
  "Bluetooth",
  "BluetoothDevice",
  "BluetoothLeScanFilterInit",
  "BluetoothRemoteGattCharacteristic",
  "BluetoothRemoteGattServer",
  "BluetoothRemoteGattService",
  "Event",
  "MessageEvent",
  "Navigator",
  "RequestDeviceOptions",
  "Window",
] }
