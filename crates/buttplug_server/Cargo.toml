[package]
name = "buttplug_server"
version = "10.0.5"
authors = ["Nonpolynomial Labs, LLC <kyle@nonpolynomial.com>"]
description = "Buttplug Intimate Hardware Control Library - Core Library"
license = "BSD-3-Clause"
homepage = "http://buttplug.io"
repository = "https://github.com/buttplugio/buttplug.git"
readme = "./README.md"
keywords = ["usb", "serial", "hardware", "bluetooth", "teledildonics"]
edition = "2024"
exclude = ["examples/**"]

[lib]
name = "buttplug_server"
path = "src/lib.rs"
test = true
doctest = true
doc = true
crate-type = ["cdylib", "rlib"]

[features]
default=["tokio-runtime"]
tokio-runtime=["buttplug_core/tokio-runtime"]
wasm=["buttplug_core/wasm", "uuid/js", "instant/wasm-bindgen"]

[dependencies]
buttplug_core = { version = "10.0.4", path = "../buttplug_core", default-features = false  }
buttplug_server_device_config = { version = "10.2.0", path = "../buttplug_server_device_config" }
futures = "0.3.33"
futures-util = "0.3.33"
thiserror = "2.0.19"
log = "0.4.33"
getset = "0.1.7"
tokio = { version = "1.53.1", features = ["macros"] }
dashmap = { version = "6.2.1" }
tracing = "0.1.44"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
jsonschema = { version = "0.49.1", default-features = false }
once_cell = "1.21.4"
tokio-stream = "0.1.19"
strum_macros = "0.28.0"
strum = "0.28.0"
uuid = { version = "1.24.0", features = ["serde", "v4"] }
async-trait = "0.1.91"
instant = "0.1.13"
tokio-util = "0.7.19"
regex-lite = "0.1.9"
prost = "0.14.4"
paste = "1.0.15"
aes = { version = "0.9.1" }
ecb = { version = "0.2.0", features = ["alloc"] }
sha2 = { version = "0.11.0" }
md-5 = "0.11.0"
byteorder = "1.5.0"
# Used by several packages, but we need to bring in the JS feature for wasm. Pinned at 0.8 until
# dependencies update
rand = { version = "0.10" }
derive_more = { version = "2.1.1", features = ["from"] }
evalexpr = { version = "13.1.0", features = ["rand"] }

[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"]}
# This is not used anywhere in our code, rather it's to fix issues with some dependencies using
# older versions of getrandom that won't compile for WASM otherwise. 
getrandom_old = { version = "0.2.17", features = ["js"], package = "getrandom"}
